name: Compilar Seraflix para macOS

on:
  push:
    paths-ignore: ['Resources/fallback/**', 'Resources/ui-source-commit.txt', 'docs/**', '*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      ui_ref:
        description: Commit ou branch da UI (main após merge do PR mac)
        default: main
        type: string
      architecture:
        description: Arquitetura para o build manual
        type: choice
        options: [ambas, arm64, x86_64]
        default: ambas
      source_dependencies:
        description: Compilar dependências das fontes, preservando corresponding source
        default: false
        type: boolean
      run_smoke:
        description: Executar testes de reprodução no runner (validação visual pendente no Mac)
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}${{ inputs.architecture && format('-{0}', inputs.architecture) || '' }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.architecture == 'arm64' && '[{"arch":"arm64","runner":"macos-latest"}]' || inputs.architecture == 'x86_64' && '[{"arch":"x86_64","runner":"macos-15-intel"}]' || '[{"arch":"arm64","runner":"macos-latest"},{"arch":"x86_64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      # Durante o PR inicial usa branch isolada. Depois do merge, o default é main.
      UI_REF: ${{ inputs.ui_ref || vars.UI_REF || (github.repository == 'mthsrfm-byte/stremio-sera' && startsWith(github.ref, 'refs/heads/build/') && 'feat/mac-platform') || 'main' }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.1.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
      DEPS_MODE: ${{ (inputs.source_dependencies || startsWith(github.ref, 'refs/tags/')) && 'source' || 'binary' }}
      SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ferramentas de compilação
        run: brew install pkgconf meson ninja cmake automake nasm
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: |
            .build/downloads
            .build/native-deps
          key: native-v2-${{ runner.os }}-${{ matrix.arch }}-${{ env.DEPS_MODE }}-${{ hashFiles('scripts/dependency-lock.json', 'scripts/build-ffmpeg.sh', 'scripts/build-dependencies-source.sh') }}
          restore-keys: |
            native-v2-${{ runner.os }}-${{ matrix.arch }}-${{ env.DEPS_MODE }}-
            native-${{ runner.os }}-${{ matrix.arch }}-${{ env.DEPS_MODE }}-
      - name: Testar validador real de cache e bootstrap
        run: |
          scripts/test-ui-cache.sh
          scripts/test-web-storage.sh
          node --test tests/server-bootstrap.test.mjs
      - name: Compilar .app e DMG assinado ad hoc
        run: |
          mkdir -p artifacts
          set -o pipefail
          scripts/build.sh 2>&1 | tee "artifacts/build-$ARCH.log"
      - name: Smoke test nativo (WKWebView, libmpv e mídia HTTP local)
        if: inputs.run_smoke || vars.RUN_PLAYBACK_TESTS == 'true'
        run: scripts/smoke-test.sh
      - name: Registrar estado dos testes nos checks
        if: always()
        run: |
          for result in build/smoke-*.json; do
            [ -f "$result" ] || continue
            echo "::notice title=$(basename "$result")::$(jq -c . "$result")"
          done
      - name: Assinar appcast Sparkle (quando configurado)
        if: startsWith(github.ref, 'refs/tags/') && env.DEPS_MODE == 'source'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: scripts/generate-appcast.sh
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true' && hashFiles(format('.build/native-deps/ffmpeg-{0}.sha256', matrix.arch)) != '' && hashFiles('.build/native-deps/bin/ffmpeg') != '' && hashFiles('.build/native-deps/bin/ffprobe') != ''
        with:
          path: |
            .build/downloads
            .build/native-deps
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Guardar artefatos e evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seraflix-${{ matrix.arch }}
          path: |
            artifacts/
            build/smoke-*.json
            build/torrent-range.json
            build/smoke-http.log
            build/smoke-media/*.mp4
          if-no-files-found: warn
          retention-days: 30
      # Não publicar binários GPL obtidos de snapshots sem corresponding source exata.
      # Releases públicas exigem DEPS_MODE=source e os arquivos de fontes associados.
      - name: Publicar release com fontes correspondentes
        if: startsWith(github.ref, 'refs/tags/') && env.DEPS_MODE == 'source'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --draft --title "Seraflix $GITHUB_REF_NAME" --notes-file docs/release.md || gh release view "$GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
