name: Diagnóstico rápido do player nativo

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            .build/downloads
            .build/native-deps
          key: native-v2-${{ runner.os }}-arm64-binary-${{ hashFiles('scripts/dependency-lock.json', 'scripts/build-ffmpeg.sh', 'scripts/build-dependencies-source.sh') }}
          restore-keys: native-v2-${{ runner.os }}-arm64-binary-
      - name: Baixar dylibs e headers fixados, sem compilar FFmpeg
        run: python3 scripts/prepare-dependencies.py
      - name: Compilar e inicializar somente AppKit e libmpv
        id: init
        run: |
          mkdir -p artifacts
          set -o pipefail
          if [ -x .build/native-deps/bin/ffmpeg ]; then
            .build/native-deps/bin/ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24 -t 4 -c:v mpeg4 -q:v 4 -movflags +faststart -y tests/fixtures/generated-smoke.mp4
            cp tests/fixtures/generated-smoke.mp4 artifacts/generated-smoke.mp4
          fi
          scripts/test-player-init.sh 2>&1 | tee artifacts/player-probe.log
      - name: Decodificar MPEG4 e HEVC 4K com um servidor HTTP Range
        if: always() && steps.init.outcome == 'success'
        run: |
          set -o pipefail
          python3 scripts/serve-fixtures.py 18766 --bind 127.0.0.1 --directory tests/fixtures > artifacts/player-probe-http.log 2>&1 &
          PROBE_HTTP_PID=$!
          cleanup() {
            PROBE_EXIT_STATUS=$?
            if [ "$PROBE_EXIT_STATUS" != 0 ]; then cat artifacts/player-probe-http.log; fi
            kill "$PROBE_HTTP_PID" 2>/dev/null || true
            wait "$PROBE_HTTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          verify_range() {
            PROBE_LABEL="$1"
            PROBE_MEDIA="$2"
            PROBE_HTTP_STATUS="$(curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 --range 0-15 --dump-header "artifacts/player-probe-$PROBE_LABEL-http.headers" --output "artifacts/player-probe-$PROBE_LABEL-range.bin" --write-out '%{http_code}' "http://127.0.0.1:18766/$PROBE_MEDIA")"
            if [ "$PROBE_HTTP_STATUS" != 206 ] || [ "$(wc -c < "artifacts/player-probe-$PROBE_LABEL-range.bin" | tr -d ' ')" != 16 ]; then
              printf 'Servidor de teste não respondeu Range/206 corretamente: HTTP %s\n' "$PROBE_HTTP_STATUS"
              return 1
            fi
          }
          verify_range mpeg4 mpeg4-smoke.mp4
          verify_range hevc hevc-4k-tracks.mkv
          PROBE_FAILED=0
          scripts/test-player-init.sh http://127.0.0.1:18766/mpeg4-smoke.mp4 mpeg4 2>&1 | tee artifacts/player-probe-mpeg4.log || PROBE_FAILED=1
          scripts/test-player-init.sh http://127.0.0.1:18766/hevc-4k-tracks.mkv hevc 2>&1 | tee artifacts/player-probe-hevc.log || PROBE_FAILED=1
          scripts/test-player-init.sh http://127.0.0.1:18766/mpeg4-smoke.mp4 web-overlay --web-overlay 2>&1 | tee artifacts/player-probe-web-overlay.log || PROBE_FAILED=1
          if [ -f tests/fixtures/generated-smoke.mp4 ]; then
            scripts/test-player-init.sh http://127.0.0.1:18766/generated-smoke.mp4 generated --web-overlay 2>&1 | tee artifacts/player-probe-generated.log || PROBE_FAILED=1
          fi
          exit "$PROBE_FAILED"
      - name: Guardar diagnóstico mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seraflix-player-probe
          path: |
            artifacts/player-probe*
            artifacts/generated-smoke.mp4
          retention-days: 7
