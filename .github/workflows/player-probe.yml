name: Diagnóstico rápido do player nativo

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar dylibs e headers fixados, sem compilar FFmpeg
        run: python3 scripts/prepare-dependencies.py
      - name: Compilar e inicializar somente AppKit e libmpv
        id: init
        run: |
          mkdir -p artifacts
          set -o pipefail
          scripts/test-player-init.sh 2>&1 | tee artifacts/player-probe.log
      - name: Decodificar MPEG4 por HTTP com Range e verificar pixels
        if: always() && steps.init.outcome == 'success'
        run: |
          set -o pipefail
          python3 scripts/serve-fixtures.py 18766 --bind 127.0.0.1 --directory tests/fixtures > artifacts/player-probe-mpeg4-http.log 2>&1 &
          PROBE_HTTP_PID=$!
          cleanup() {
            kill "$PROBE_HTTP_PID" 2>/dev/null || true
            wait "$PROBE_HTTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          HTTP_STATUS="$(curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 --range 0-15 --dump-header artifacts/player-probe-mpeg4-http.headers --output artifacts/player-probe-mpeg4-range.bin --write-out '%{http_code}' http://127.0.0.1:18766/mpeg4-smoke.mp4)"
          if [ "$HTTP_STATUS" != 206 ] || [ "$(wc -c < artifacts/player-probe-mpeg4-range.bin | tr -d ' ')" != 16 ]; then
            cat artifacts/player-probe-mpeg4-http.log
            printf 'Servidor de teste não respondeu Range/206 corretamente: HTTP %s\n' "$HTTP_STATUS"
            exit 1
          fi
          scripts/test-player-init.sh http://127.0.0.1:18766/mpeg4-smoke.mp4 mpeg4 2>&1 | tee artifacts/player-probe-mpeg4.log
      - name: Decodificar HEVC 4K por HTTP com Range e verificar pixels
        if: always() && steps.init.outcome == 'success'
        run: |
          set -o pipefail
          python3 scripts/serve-fixtures.py 18767 --bind 127.0.0.1 --directory tests/fixtures > artifacts/player-probe-hevc-http.log 2>&1 &
          PROBE_HTTP_PID=$!
          cleanup() {
            kill "$PROBE_HTTP_PID" 2>/dev/null || true
            wait "$PROBE_HTTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          HTTP_STATUS="$(curl --fail --silent --show-error --retry 5 --retry-connrefused --retry-delay 1 --max-time 5 --range 0-15 --dump-header artifacts/player-probe-hevc-http.headers --output artifacts/player-probe-hevc-range.bin --write-out '%{http_code}' http://127.0.0.1:18767/hevc-4k-tracks.mkv)"
          if [ "$HTTP_STATUS" != 206 ] || [ "$(wc -c < artifacts/player-probe-hevc-range.bin | tr -d ' ')" != 16 ]; then
            cat artifacts/player-probe-hevc-http.log
            printf 'Servidor de teste não respondeu Range/206 corretamente: HTTP %s\n' "$HTTP_STATUS"
            exit 1
          fi
          scripts/test-player-init.sh http://127.0.0.1:18767/hevc-4k-tracks.mkv hevc 2>&1 | tee artifacts/player-probe-hevc.log
      - name: Guardar diagnóstico mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seraflix-player-probe
          path: artifacts/player-probe*
          retention-days: 7
