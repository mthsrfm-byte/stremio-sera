name: Diagnóstico rápido do player nativo

on:
  push:
    branches: ['build/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Baixar dylibs e headers fixados, sem compilar FFmpeg
        run: python3 scripts/prepare-dependencies.py
      - name: Compilar e inicializar somente AppKit e libmpv
        run: |
          mkdir -p artifacts
          set -o pipefail
          scripts/test-player-init.sh 2>&1 | tee artifacts/player-probe.log
      - name: Decodificar HEVC 4K por HTTP e verificar pixels do framebuffer
        run: |
          set -o pipefail
          python3 -m http.server 18766 --bind 127.0.0.1 --directory tests/fixtures > artifacts/player-probe-http.log 2>&1 &
          PROBE_HTTP_PID=$!
          trap 'kill "$PROBE_HTTP_PID" 2>/dev/null || true' EXIT
          scripts/test-player-init.sh http://127.0.0.1:18766/hevc-4k-tracks.mkv 2>&1 | tee artifacts/player-probe-video.log
      - name: Guardar diagnóstico mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Seraflix-player-probe
          path: artifacts/player-probe*
          retention-days: 7
