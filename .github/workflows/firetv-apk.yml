# APK do Seraflix para Fire TV Stick (pasta android/), publicado na release "firetv":
#   https://github.com/mthsrfm-byte/stremio-sera/releases/download/firetv/Seraflix-FireTV.apk
# O APK é só a casca: o app em si (dist-firetv/) ele baixa sozinho da main a cada abertura.
# Então só precisa rodar de novo quando a pasta android/ muda.
name: APK do Fire TV

on:
  push:
    branches: [main, 'claude/amazon-fire-stick-port-*']
    paths: ['android/**', '.github/workflows/firetv-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firetv-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # o número de commits vira o versionCode do APK

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build do app (vai dentro do APK como versão inicial)
        env:
          KAI_TMDB: ${{ secrets.TMDB_API_KEY }}
          KAI_MDBLIST: ${{ secrets.MDBLIST_API_KEY }}
        run: |
          export KAI_COMMIT="$GITHUB_SHA"
          export KAI_BUILD_DATE="$(git log -1 --format=%cI)"
          export KAI_COMMIT_MSG="$(git log -1 --format=%s)"
          npm run build:firetv

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-34" > /dev/null

      - name: APK
        env:
          # Chave fixa (Settings → Secrets → Actions): FIRETV_KEYSTORE_B64 = base64 do .jks e
          # FIRETV_KEYSTORE_PASSWORD = a senha dele. Sem ela o APK sai com uma chave temporária.
          KS_B64: ${{ secrets.FIRETV_KEYSTORE_B64 }}
          FIRETV_KEYSTORE_PASSWORD: ${{ secrets.FIRETV_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/seraflix.jks"
            export FIRETV_KEYSTORE="$RUNNER_TEMP/seraflix.jks"
          else
            unset FIRETV_KEYSTORE_PASSWORD
          fi
          android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Seraflix-FireTV
          path: android/build/Seraflix-FireTV.apk

      - name: Publicar na release "firetv"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="APK do Seraflix para Fire TV Stick. Instale pelo app Downloader com o link de download deste arquivo. O app se atualiza sozinho pela main; este APK só muda quando a pasta android/ muda. Build: ${GITHUB_SHA::7} (${GITHUB_REF_NAME})."
          if gh release view firetv > /dev/null 2>&1; then
            gh release edit firetv --notes "$NOTES"
          else
            gh release create firetv --title "Seraflix para Fire TV" --notes "$NOTES" --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload firetv android/build/Seraflix-FireTV.apk --clobber
