<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <!-- Só o código do próprio app roda; dados de addons/APIs nunca viram script. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *; font-src 'self'; object-src 'none'; frame-src https://www.youtube-nocookie.com https://www.youtube.com">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0d0b14">
  <meta name="referrer" content="no-referrer">
  <title>Seraflix</title>
  <link rel="preload" href="fonts/bricolage-grotesque-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bricolage-grotesque-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
  <style>
    /* Tranca da versão web (gate.js). Fica por cima de tudo até a senha certa. */
    .gate { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; background: #0d0b14; color: #f4f1fa; font-family: 'Geist', system-ui, sans-serif; }
    .gate[hidden] { display: none; }
    .gate-box { width: min(420px, 86vw); text-align: center; }
    .gate-box h1 { margin: 0 0 8px; font: 800 36px 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.5px; }
    .gate-box p { margin: 0 0 24px; color: #9d97ab; font-size: 16px; }
    .gate-box input { box-sizing: border-box; width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #2a2639; background: #17141f; color: #f4f1fa; font: 500 18px 'Geist', system-ui, sans-serif; outline: none; }
    .gate-box input:focus { border-color: #7c5cff; }
    .gate-box button { margin-top: 14px; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: #7c5cff; color: #fff; font: 600 17px 'Geist', system-ui, sans-serif; cursor: pointer; }
    .gate-box .msg { min-height: 22px; margin-top: 14px; color: #ff8a8a; font-size: 15px; }
  </style>
</head>
<body class="sera">
  <div id="app">
    <div id="boot" class="boot intro">
      <div class="intro-glow"></div>
      <div class="intro-mark">
        <div class="intro-logo"><svg class="sera-logo" xmlns="http://www.w3.org/2000/svg" viewBox="9.45 13.36 305.55 98.86"><path d="M189.18 13.37 L9.45 13.37 L9.45 22.36 L9.45 112.22 L18.43 112.22 L18.43 22.36 L189.18 22.36Z"/><path d="M189.18 94.24 L189.18 40.32 L189.18 31.34 L162.22 31.34 L153.24 31.34 L153.24 94.24 L162.22 94.24 L162.22 40.32 L180.2 40.32 L180.2 94.24Z"/><path d="M198.17 13.36 L198.17 22.35 L198.17 94.24 L207.16 94.24 L207.16 49.31 L234.12 49.31 L234.12 40.32 L207.16 40.32 L207.16 22.35 L252.09 22.35 L252.09 94.24 L261.08 94.24 L261.08 22.35 L306.01 22.35 L306.01 103.23 L18.43 103.23 L18.43 112.22 L306.01 112.22 L315 112.22 L315 22.35 L315 13.36Z"/><path d="M136.26 67.28 L144.25 67.28 L144.25 40.32 L144.25 31.34 L135.26 31.34 L27.42 31.34 L27.42 40.32 L27.42 67.28 L36.41 67.28 L54.38 67.28 L54.38 85.26 L27.42 85.26 L27.42 94.24 L54.38 94.24 L63.37 94.24 L63.37 67.28 L63.37 58.3 L36.41 58.3 L36.41 40.32 L135.26 40.32 L135.26 58.3 L109.3 58.3 L109.3 67.28 L109.44 67.28 L136.4 94.24 L144.25 94.24 L144.25 89.39 L122.15 67.28 L135.26 67.28Z"/><path d="M72.36 58.3h26.96v8.99h-26.96Z"/><path d="M72.36 85.26h26.96v8.99h-26.96Z"/><path d="M225.13 67.28h8.99v26.96h-8.99Z"/><path d="M279.05 40.32h8.99v53.92h-8.99Z"/></svg><span class="intro-sweep"></span></div>
        <b class="intro-flix">flix</b>
      </div>
      <div class="intro-bar"><i></i></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="gate" class="gate" hidden>
    <form id="gateForm" class="gate-box" autocomplete="off">
      <h1>Seraflix</h1>
      <p>Digite a senha para entrar.</p>
      <input id="gateInput" type="password" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <div id="gateMsg" class="msg"></div>
    </form>
  </div>
  <script src="gate-config.js"></script>
  <script src="gate.js"></script>
</body>
</html>
